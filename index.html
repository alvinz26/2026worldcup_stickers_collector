      padding: 4px;
      display: flex;
      gap: 4px;
    }
    .lang-btn, .region-btn {
      background: transparent;
      border: none;
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      color: #64748b;

      margin-bottom: 20px;

      border: 1px solid #e2e8f0;

      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;

      right: 16px;
      background: #e2e8f0;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      color: #475569;
    }
    .clear-search:hover { background: #cbd5e1; }

      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .team-btn {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .team-btn.active { background: #1e293b; border-color: #1e293b; color: white; }

    @media (min-width: 640px) { .sticker-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .sticker-grid { grid-template-columns: repeat(3, 1fr); } }
    
    .sticker-card {
      background: white;
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border: 1px solid #edf2f7;
    }
    .sticker-card.collected { background: #fef9e3; border-color: #fde047; }
    .sticker-icon {

      background: #f1f5f9;

      justify-content: center;

    .congrats-toast {

// 解析贴纸函数
function buildStickers(raw) {
  const lines = raw.split(/\r?\n/);
  const stickers = [];
  let inExtra = false, inCoca = false;
  for (let line of lines) {
    line = line.trim();
    if (!line) continue;
    if (line.includes("Extra Sticker")) { inExtra = true; inCoca = false; continue; }
    if (line.includes("Coca-Cola")) { inCoca = true; inExtra = false; continue; }
    if (line.startsWith("Base Stickers") || line.startsWith("980 stickers") || line.startsWith("Listed in Album") ||
        line.startsWith("USA Exclusive") || line.startsWith("iCollect Exclusive")) continue;
    const match = line.match(/^([A-Z0-9]+)\s+(.+)$/);
    if (match) {
      let code = match[1];
      let fullName = match[2];
      let category = "Special";
      let displayName = fullName;
      const dashIdx = fullName.lastIndexOf(" - ");
      if (dashIdx !== -1) {
        displayName = fullName.substring(0, dashIdx);
        let country = fullName.substring(dashIdx + 3);
        country = country.replace(/\s+FOIL$/, "");
        category = country;
      } else {
        displayName = fullName.replace(/\s+FOIL$/, "");
        if (code.startsWith("FWC")) category = "FIFA Museum";
        else if (code === "00") category = "Panini Logo";
      }
      if (inCoca) category = "Coca-Cola";
      if (inExtra) category = "Extra Sticker";
      stickers.push({
        id: code,
        name: displayName,
        category: category,
        teamId: (category === "Special" ? "special" : 
                 category === "FIFA Museum" ? "museum" :
                 category === "Coca-Cola" ? "coca" :
                 category === "Extra Sticker" ? "extra" :
                 category === "Panini Logo" ? "logo" : 
                 category.toLowerCase().replace(/[^a-z]/g, '')),
        collected: false,
        code: code
      });
    } else if (inExtra && line.match(/^[A-Za-z]/)) {
      stickers.push({
        id: `extra_${stickers.length}`,
        name: line,
        category: "Extra Sticker",
        teamId: "extra",
        collected: false,
        code: ""
      });
    }
  }
  const unique = [];
  const seen = new Set();
  for (const s of stickers) {
    if (!seen.has(s.id)) {
      seen.add(s.id);
      unique.push(s);
    }
  }
  return unique;
}

// 初始数据库（包含所有基础贴纸）

function updateCocaColaByRegion(region) {
  // 移除所有现有可口可乐贴纸
  stickerDatabase = stickerDatabase.filter(s => s.category !== "Coca-Cola");
  const names = cocaVersions[region];
  for (let i = 0; i < names.length; i++) {
    stickerDatabase.push({
      id: `cc${i+1}`,
      name: names[i],
      category: "Coca-Cola",
      teamId: "coca",
      collected: false,

// 双语文本库
const i18n = {
  zh: {
    mainTitle: "🏆 2026 帕尼尼世界杯贴纸",
    progressLabel: "📋 我的收集进度",
    viewAll: "📋 全部贴纸",
    viewMissing: "❌ 缺失列表",

    footer: "⚡ 点击卡片标记“已收集” · 数据保存在你的手机里",
    congrats: "🎉 恭喜！你集齐了全部贴纸！ 🎉",
    empty: "✨ 没有找到贴纸，试试其他关键词 ✨",
    allTeams: "全部国家/类别",
    museum: "🏛️ FIFA博物馆",
    coca: "🥤 可口可乐",
    extra: "⭐ 额外贴纸",
    logo: "🏷️ 帕尼尼标志",

  },
  en: {
    mainTitle: "🏆 2026 Panini World Cup Stickers",
    progressLabel: "📋 My Collection Progress",
    viewAll: "📋 All Stickers",
    viewMissing: "❌ Missing List",
    searchPlaceholder: "🔍 Search player / country / code...",
    footer: "⚡ Tap to mark collected · Data saved locally",
    congrats: "🎉 Congratulations! You've collected all stickers! 🎉",
    empty: "✨ No stickers found. Try a different keyword. ✨",
    allTeams: "All Teams / Categories",
    museum: "🏛️ FIFA Museum",
    coca: "🥤 Coca‑Cola",
    extra: "⭐ Extra Stickers",
    logo: "🏷️ Panini Logo",
    host: "🌍 Host Cities"
  }
};

let currentLang = localStorage.getItem('app_lang') || 'zh';
let currentRegion = localStorage.getItem('app_region') || 'na';
let currentView = "all";          // "all" 或 "missing"
let currentFilterTeam = "all";
let searchKeyword = "";

// 更新可口可乐贴纸（根据地区）
function updateCocaColaByRegion(region) {
  stickerDatabase = stickerDatabase.filter(s => s.category !== "Coca-Cola");
  const names = cocaVersions[region];
  for (let i = 0; i < names.length; i++) {
    stickerDatabase.push({
      id: `cc${i+1}`,
      name: names[i],
      category: "Coca-Cola",
      teamId: "coca",
      collected: false,
      code: `CC${i+1}`
    });
  }
  // 重新整理顺序（按id排序）
  stickerDatabase.sort((a,b) => (a.id || '').localeCompare(b.id || ''));
}

// 判断是否为球员贴纸（用于显示跑步图标）
function isPlayerSticker(sticker) {
  if (sticker.name.includes("Team Logo") || sticker.name.includes("Team Photo") ||
      sticker.category === "FIFA Museum" || sticker.category === "Coca-Cola" ||
      sticker.category === "Extra Sticker" || sticker.category === "Panini Logo" ||
      sticker.category === "Host Countries & Cities" || sticker.id === "00") {
    return false;
  }
  return true;
}

// 本地存储
function loadCollectedStatus() {
  const saved = localStorage.getItem("sticker_progress_final");
  if (!saved) return;
  try {
    const map = JSON.parse(saved);
    stickerDatabase.forEach(s => { if (map[s.id] === true) s.collected = true; });
  } catch(e) {}
}
function persistCollectedStatus() {
  const map = {};
  stickerDatabase.forEach(s => { map[s.id] = s.collected; });
  localStorage.setItem("sticker_progress_final", JSON.stringify(map));
}

function toggleSticker(stickerId) {
  const sticker = stickerDatabase.find(s => s.id === stickerId);
  if (sticker) {
    sticker.collected = !sticker.collected;
    persistCollectedStatus();
    renderAll();
    updateStatsAndCheckCompletion();
  }
}

let completionFlag = false;
function updateStatsAndCheckCompletion() {
  const collected = stickerDatabase.filter(s => s.collected).length;
  const total = stickerDatabase.length;
  const percent = total === 0 ? 0 : (collected / total) * 100;
  document.getElementById("countDisplay").innerText = `${collected} / ${total}`;
  document.getElementById("progressFill").style.width = `${percent}%`;
  if (collected === total && total > 0 && !completionFlag) {
    completionFlag = true;
    const toast = document.getElementById("congratsToast");
    toast.innerText = i18n[currentLang].congrats;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 4000);
  } else if (collected !== total) {
    completionFlag = false;
  }
}

function getFilteredStickers() {
  let filtered = [...stickerDatabase];
  if (currentView === "missing") filtered = filtered.filter(s => !s.collected);
  if (currentFilterTeam !== "all") {
    filtered = filtered.filter(s => s.teamId === currentFilterTeam);
  }
  if (searchKeyword.trim()) {
    const kw = searchKeyword.trim().toLowerCase();
    filtered = filtered.filter(s => 
      s.name.toLowerCase().includes(kw) || 
      s.category.toLowerCase().includes(kw) || 
      (s.code && s.code.toLowerCase().includes(kw))
    );
  }
  return filtered;
}

function renderTeamTabs() {
  const teamsMap = new Map();
  teamsMap.set("all", i18n[currentLang].allTeams);
  // 收集所有国家teamId（非特殊）
  const countrySet = new Set();
  for (const s of stickerDatabase) {
    if (s.teamId && !["museum","coca","extra","logo","host","special"].includes(s.teamId)) {
      countrySet.add(s.teamId);
    }
  }
  const sortedCountries = Array.from(countrySet).sort();
  for (const cid of sortedCountries) {
    const sample = stickerDatabase.find(s => s.teamId === cid);
    if (sample) teamsMap.set(cid, sample.category);
  }
  // 特殊类别
  if (stickerDatabase.some(s => s.category === "FIFA Museum")) teamsMap.set("museum", i18n[currentLang].museum);
  if (stickerDatabase.some(s => s.category === "Coca-Cola")) teamsMap.set("coca", i18n[currentLang].coca);
  if (stickerDatabase.some(s => s.category === "Extra Sticker")) teamsMap.set("extra", i18n[currentLang].extra);
  if (stickerDatabase.some(s => s.category === "Panini Logo")) teamsMap.set("logo", i18n[currentLang].logo);
  if (stickerDatabase.some(s => s.category === "Host Countries & Cities")) teamsMap.set("host", i18n[currentLang].host);
  
  const container = document.getElementById("teamTabs");
  container.innerHTML = Array.from(teamsMap.entries()).map(([id, name]) => 
    `<div class="team-btn ${currentFilterTeam === id ? 'active' : ''}" data-team="${id}">${escapeHtml(name)}</div>`
  ).join("");
  document.querySelectorAll(".team-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilterTeam = btn.getAttribute("data-team");
      renderTeamTabs();
      renderStickersList();
    });
  });
}

function renderStickersList() {
  const container = document.getElementById("stickerList");
  const filtered = getFilteredStickers();
  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-message">${i18n[currentLang].empty}</div>`;
    return;
  }
  container.innerHTML = filtered.map(s => {
    const collectedClass = s.collected ? "collected" : "";
    const icon = isPlayerSticker(s) ? '🏃‍➡️' : '🃏';
    const displayCode = s.code || s.id;
    return `
      <div class="sticker-card ${collectedClass}" data-id="${s.id}">
        <div class="sticker-icon">${icon}</div>
        <div class="sticker-info">
          <div class="sticker-name">${escapeHtml(s.name)}</div>
          <div class="sticker-code">${escapeHtml(displayCode)}</div>
        </div>
        <div class="check-icon">${s.collected ? '✅' : '⬜'}</div>
      </div>
    `;
  }).join("");
  container.querySelectorAll(".sticker-card").forEach(card => {
    card.addEventListener("click", (e) => {
      const id = card.getAttribute("data-id");
      if (id) toggleSticker(id);
    });
  });
}

function escapeHtml(str) { 
  if (!str) return '';
  return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); 
}

function renderAll() {
  renderTeamTabs();
  renderStickersList();
}

// 语言切换
function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('app_lang', lang);
  document.querySelectorAll('.lang-btn').forEach(btn => {
    if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
    else btn.classList.remove('active');
  });
  document.getElementById('mainTitle').innerText = i18n[lang].mainTitle;
  document.getElementById('progressLabel').innerText = i18n[lang].progressLabel;
  document.getElementById('viewAllBtn').innerText = i18n[lang].viewAll;
  document.getElementById('viewMissingBtn').innerText = i18n[lang].viewMissing;
  document.getElementById('searchInput').placeholder = i18n[lang].searchPlaceholder;
  document.getElementById('footerText').innerText = i18n[lang].footer;
  document.getElementById('congratsToast').innerText = i18n[lang].congrats;
  renderTeamTabs();
  renderStickersList();
}

// 地区切换
function setRegion(region) {
  currentRegion = region;
  localStorage.setItem('app_region', region);
  document.querySelectorAll('.region-btn').forEach(btn => {
    if (btn.getAttribute('data-region') === region) btn.classList.add('active');
    else btn.classList.remove('active');
  });
  // 保存当前可口可乐贴纸的收集状态（按球员名）
  const oldCocaMap = {};
  stickerDatabase.filter(s => s.category === "Coca-Cola").forEach(s => {
    oldCocaMap[s.name] = s.collected;
  });
  // 更新数据库
  updateCocaColaByRegion(region);
  // 恢复收集状态（匹配球员名）
  stickerDatabase.filter(s => s.category === "Coca-Cola").forEach(s => {
    if (oldCocaMap[s.name] !== undefined) s.collected = oldCocaMap[s.name];
  });
  persistCollectedStatus();
  renderAll();
  updateStatsAndCheckCompletion();
}

// 初始化
function init() {
  loadCollectedStatus();
  setLanguage(currentLang);
  setRegion(currentRegion); // 这会调用 updateCocaColaByRegion 并渲染
  // 绑定视图切换
  const allBtn = document.getElementById("viewAllBtn");
  const missingBtn = document.getElementById("viewMissingBtn");
  allBtn.addEventListener("click", () => {
    currentView = "all";
    allBtn.classList.add("active");
    missingBtn.classList.remove("active");
    renderAll();
  });
  missingBtn.addEventListener("click", () => {
    currentView = "missing";
    missingBtn.classList.add("active");
    allBtn.classList.remove("active");
    renderAll();
  });
  // 搜索框
  const searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("input", (e) => {
    searchKeyword = e.target.value;
    renderStickersList();
  });
  const clearBtn = document.getElementById("clearSearchBtn");
  clearBtn.addEventListener("click", () => {
    searchInput.value = "";
    searchKeyword = "";
    renderStickersList();
  });
  // 语言按钮
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.getAttribute('data-lang')));
  });
  // 地区按钮
  document.querySelectorAll('.region-btn').forEach(btn => {
    btn.addEventListener('click', () => setRegion(btn.getAttribute('data-region')));
  });
  updateStatsAndCheckCompletion();
}
init();
</script>
